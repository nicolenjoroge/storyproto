<body>

  <!-- CAMPAIGN LOADER — shown once per session, alternates randomly -->
  <div id="campaign-loader" class="campaign-loader">
    <div id="loader-mount" class="loader-mount"></div>
  </div>

  <!-- rest of your existing HTML body content goes here unchanged -->
  <!-- (nav, sections, footer, modals — everything between line 22 and 622) -->

  <footer class="site-footer">
    <div class="footer-top">
      <img
        src="https://bpmstoryhub.blob.core.windows.net/media/Images/campaign-exit.png"
        alt="REA"
        class="footer-logo"
      />
      <div class="footer-copy">
        <div class="footer-headline">The REA Challenge: Reduce and Eliminate</div>
        <div class="footer-sub">Take the challenge. Reduce one process. Eliminate one unnecessary step.</div>
      </div>
      <button
        class="footer-cta"
        onclick="window.open('https://apps.powerapps.com/play/e/7a3eb501-64ec-ed0a-adcb-23e9d3acc947/a/40c8c956-cde8-4a50-93df-ff36cc1200c9?hidenavbar=true', '_blank')"
      >
        Share Your Idea →
      </button>
    </div>

    <div class="footer-divider"></div>

    <div class="footer-bottom">
      <div class="footer-legal">© 2026 REA · NCBA REA Buzz</div>
      <div class="footer-legal">Reduce, Eliminate, Automate</div>
    </div>
  </footer>

  <!-- ── CARD MODAL ── -->
  <div class="card-modal-overlay" id="cardModal" onclick="closeCardModal()">
    <div class="card-modal" onclick="event.stopPropagation()">
      <button class="card-modal-close" onclick="closeCardModal()">✕</button>
      <div class="card-modal-body">
        <h3 class="card-modal-title" id="cardModalTitle"></h3>
        <p class="card-modal-desc" id="cardModalDesc"></p>
        <div class="card-modal-stats" id="cardModalStats"></div>
      </div>
    </div>
  </div>

  <!-- ── CAMPAIGN POPUP SYSTEM ── -->

  <!-- Overlay backdrop -->
  <div id="cp-backdrop" class="cp-backdrop" onclick="closeCampaignOverlay()"></div>

  <!-- Contextual lightbox -->
  <div id="cp-lightbox" class="cp-lightbox">
    <button class="cp-close-btn" onclick="closeCampaignOverlay()">✕</button>
    <img id="cp-lightbox-img" class="cp-lightbox-img" src="" alt="" />
    <div id="cp-lightbox-caption" class="cp-lightbox-caption"></div>
  </div>

  <!-- Scroll-triggered section teaser -->
  <div id="cp-teaser" class="cp-teaser" onclick="window._cpTeaserClick && window._cpTeaserClick(event)">
    <button class="cp-dismiss-btn" onclick="dismissTeaser()">×</button>
    <img id="cp-teaser-img" class="cp-teaser-img" src="" alt="" />
    <div id="cp-teaser-label" class="cp-teaser-label"></div>
    <div id="cp-teaser-text" class="cp-teaser-text"></div>
  </div>

  <!-- Exit-intent banner -->
  <div id="cp-exit-banner" class="cp-exit-banner">
    <img
      id="cp-exit-img"
      class="cp-exit-img"
      src="" alt=""
      onclick="window._cpExitClick && window._cpExitClick(event)"
    />
    <div class="cp-exit-body" onclick="window._cpExitClick && window._cpExitClick(event)">
      <div id="cp-exit-headline" class="cp-exit-headline"></div>
      <div id="cp-exit-sub" class="cp-exit-sub"></div>
    </div>
    <button class="cp-dismiss-x" onclick="dismissExitBanner()">×</button>
  </div>

  <!-- Milestone toast -->
  <div id="cp-toast" class="cp-toast" onclick="window._cpToastClick && window._cpToastClick(event)">
    <img id="cp-toast-img" class="cp-toast-img" src="" alt="" />
    <div class="cp-toast-body">
      <div id="cp-toast-title" class="cp-toast-title"></div>
      <div id="cp-toast-body" class="cp-toast-text"></div>
    </div>
    <button class="cp-dismiss-btn cp-toast-close" onclick="dismissToast()">×</button>
  </div>

  <!-- Campaign ad modal -->
  <div id="cp-ad-backdrop" class="cp-ad-backdrop" onclick="closeAdModal()"></div>
  <div id="cp-ad-modal" class="cp-ad-modal">
    <button class="cp-close-btn" onclick="closeAdModal()">✕</button>
    <img id="cp-ad-img" class="cp-ad-img" src="" alt="" />
    <div class="cp-ad-body">
      <div id="cp-ad-label" class="cp-ad-label"></div>
      <div id="cp-ad-title" class="cp-ad-title"></div>
      <div id="cp-ad-body" class="cp-ad-desc"></div>
    </div>
  </div>

  <script src="/js/env.js"></script>
  <script type="module" src="/js/main.js"></script>

</body>
</html>
